<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SnapCut - Next Gen Video Downloader</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: #0d0f1a;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
        }

        /* 3D Background Glows */
        .glow-1 {
            position: absolute;
            width: 300px;
            height: 300px;
            background: #ff007f;
            filter: blur(120px);
            border-radius: 50%;
            top: 10%;
            left: 10%;
            z-index: -1;
        }

        .glow-2 {
            position: absolute;
            width: 300px;
            height: 300px;
            background: #00f2fe;
            filter: blur(120px);
            border-radius: 50%;
            bottom: 10%;
            right: 10%;
            z-index: -1;
        }

        /* 3D Glassmorphism Card */
        .container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 30px;
            padding: 40px 30px;
            max-width: 450px;
            width: 100%;
            text-align: center;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.5),
                        inset 0 1px 0 rgba(255, 255, 255, 0.2);
            transform: perspective(1000px) rotateX(2deg);
            transition: transform 0.3s ease;
        }

        .container:hover {
            transform: perspective(1000px) rotateX(0deg) translateY(-5px);
        }

        /* Logo Styling */
        .logo {
            font-size: 2.8rem;
            font-weight: 800;
            background: linear-gradient(135deg, #00f2fe 0%, #4facfe 50%, #ff007f 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 5px;
            text-shadow: 0 10px 20px rgba(0, 242, 254, 0.3);
        }

        .tagline {
            font-size: 0.9rem;
            color: #a0a5c0;
            margin-bottom: 35px;
            font-weight: 300;
        }

        /* 3D Input Box */
        .input-box {
            position: relative;
            margin-bottom: 25px;
        }

        .input-box input {
            width: 100%;
            padding: 18px 20px;
            background: rgba(15, 18, 35, 0.8);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            color: #fff;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.3s ease;
            box-shadow: inset 0 4px 8px rgba(0, 0, 0, 0.4);
        }

        .input-box input:focus {
            border-color: #00f2fe;
            box-shadow: 0 0 20px rgba(0, 242, 254, 0.4), inset 0 2px 4px rgba(0, 0, 0, 0.4);
        }

        .input-box input::placeholder {
            color: #606885;
        }

        /* 3D Glowing Button */
        .download-btn {
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, #ff007f, #7928ca);
            border: none;
            border-radius: 20px;
            color: #ffffff;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(255, 0, 127, 0.4),
                        0 4px 0 #4a004e;
            transition: all 0.2s ease;
            transform: translateY(0);
        }

        .download-btn:active {
            transform: translateY(4px);
            box-shadow: 0 5px 15px rgba(255, 0, 127, 0.4),
                        0 0 0 #4a004e;
        }

        /* Supported Platforms */
        .features {
            margin-top: 35px;
            display: flex;
            justify-content: space-around;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            padding-top: 20px;
        }

        .feature-item {
            font-size: 0.8rem;
            color: #8088a5;
        }

        .feature-item span {
            display: block;
            color: #00f2fe;
            font-weight: 600;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <div class="glow-1"></div>
    <div class="glow-2"></div>

    <div class="container">
        <h1 class="logo">SnapCut</h1>
        <p class="tagline">Next-Generation Ultra HD Video Downloader</p>

        <div class="input-box">
            <input type="text" placeholder="Paste video link here...">
        </div>

        <button class="download-btn">Download Now ⚡</button>

        <div class="features">
            <div class="feature-item">
                <span>8K / 4K</span> Quality
            </div>
            <div class="feature-item">
                <span>Ultra Fast</span> Speed
            </div>
            <div class="feature-item">
                <span>100% Free</span> No Ads
            </div>
        </div>
    </div>

</body>
</html>
